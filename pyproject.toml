[project]
name = "ha-galaxy-fit3"
version = "0.1.0"
description = "Home Assistant integration for the Samsung Galaxy Fit3 over Samsung Accessory Protocol (SAP)."
requires-python = ">=3.12"
dependencies = [
    "bleak>=0.21.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
# Measuring the package directory (not "."): files that no test imports are still reported, at 0%,
# instead of silently vanishing from the total. Report paths come out relative to this directory.
source = ["custom_components/galaxy_fit3"]
relative_files = true
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
