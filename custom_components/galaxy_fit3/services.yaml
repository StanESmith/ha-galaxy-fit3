set_time:
  fields:
    is_24h:
      example: true
      default: true
      selector:
        boolean:
    tz_offset_seconds:
      example: -18000
      required: false
      selector:
        number:
          min: -43200
          max: 50400
          step: 1
          unit_of_measurement: s
          mode: box
    variant:
      default: standard
      selector:
        select:
          options: [standard, tz_zero, local_epoch, millis, no_tz]
    epoch_seconds:
      required: false
      selector:
        number:
          min: 1000000000
          max: 9999999999
          mode: box
set_time_rtc:
  fields:
    is_24h:
      example: true
      default: true
      selector:
        boolean:
    tz_offset_seconds:
      example: -18000
      required: false
      selector:
        number:
          min: -43200
          max: 50400
          step: 1
          unit_of_measurement: s
          mode: box
    byte_order:
      default: little
      selector:
        select:
          options: [big, little]
    offset_unit:
      default: seconds
      selector:
        select:
          options: [seconds, minutes]
reconnect:
  fields:
    replay_frames:
      example: 7
      required: false
      selector:
        number:
          min: 0
          max: 27
          step: 1
          mode: box
    skip_time_frame:
      default: false
      selector:
        boolean:
    fresh_pairing:
      default: false
      selector:
        boolean:
set_watch_face:
  fields:
    face_id:
      example: 79
      required: true
      selector:
        number:
          min: 0
          max: 255
          step: 1
          mode: box
    group:
      example: 4
      required: false
      selector:
        number:
          min: 0
          max: 255
          step: 1
          mode: box
list_watch_faces:
forget_bond:
gatt_dump:
  fields: {}
write_current_time:
  fields: {}

request_health_sync:
  fields:
    kind:
      default: request_data
      required: false
      selector:
        select:
          options:
            - request_data
            - check_status
            - measure_heart_rate
    window_days:
      default: 1
      required: false
      selector:
        number:
          min: 1
          max: 30
          step: 1
          mode: box

install_watch_face:
  fields:
    face_id:
      example: 16
      required: true
      selector:
        number:
          min: 1
          max: 255
          step: 1
          mode: box
    style:
      example: 0
      default: 0
      selector:
        number:
          min: 0
          max: 15
          step: 1
          mode: box
    handshake_only:
      default: false
      selector:
        boolean:
    wait:
      default: true
      selector:
        boolean:
