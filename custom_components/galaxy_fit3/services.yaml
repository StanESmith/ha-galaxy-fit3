set_time:
  fields:
    is_24h:
      example: true
      required: false
      selector:
        boolean:
    tz_offset_seconds:
      example: -18000
      required: false
      selector:
        number:
          min: -43200
          max: 50400
          step: 1
          unit_of_measurement: s
          mode: box
set_distance_unit:
  fields:
    unit:
      example: mi
      required: true
      selector:
        select:
          options:
            - km
            - mi
reconnect:
  fields:
    replay_frames:
      example: 7
      required: false
      selector:
        number:
          min: 0
          max: 27
          step: 1
          mode: box
    skip_time_frame:
      default: false
      selector:
        boolean:
    fresh_pairing:
      default: false
      selector:
        boolean:
set_watch_face:
  fields:
    face_id:
      example: 79
      required: true
      selector:
        number:
          min: 0
          max: 255
          step: 1
          mode: box
    group:
      example: 4
      required: false
      selector:
        number:
          min: 0
          max: 255
          step: 1
          mode: box
list_watch_faces:
forget_bond:
request_health_sync:
  fields:
    kind:
      default: request_data
      required: false
      selector:
        select:
          options:
            - request_data
            - check_status
            - measure_heart_rate
    window_days:
      default: 1
      required: false
      selector:
        number:
          min: 1
          max: 30
          step: 1
          mode: box

install_watch_face:
  fields:
    face_id:
      example: 16
      required: true
      selector:
        number:
          min: 1
          max: 255
          step: 1
          mode: box
    style:
      example: 0
      default: 0
      selector:
        number:
          min: 0
          max: 15
          step: 1
          mode: box
    handshake_only:
      default: false
      selector:
        boolean:
    wait:
      default: true
      selector:
        boolean:

fetch_face_previews:
  fields:
    face_ids:
      example: "[16, 106]"
      selector:
        object:
