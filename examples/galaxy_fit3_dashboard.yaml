streamline_templates:
  fit3_face:
    card:
      type: picture-entity
      entity: select.galaxy_fit3_watch_face
      image: '[[image]]'
      name: '[[name]]'
      show_name: true
      show_state: false
      tap_action:
        action: perform-action
        perform_action: select.select_option
        target:
          entity_id: select.galaxy_fit3_watch_face
        data:
          option: '[[name]]'
        confirmation:
          text: Switch the watch to [[name]]?
      hold_action:
        action: none
  fit3_store_face:
    card:
      type: picture-entity
      entity: select.galaxy_fit3_watch_face
      image: '[[image]]'
      name: '[[name]]'
      show_name: true
      show_state: false
      tap_action:
        action: perform-action
        perform_action: galaxy_fit3.install_watch_face
        data:
          face_id: '[[id]]'
          wait: false
        confirmation:
          text: Install [[name]] on the watch? It takes about a minute; keep the watch near Home Assistant.
      hold_action:
        action: none
views:
- title: Galaxy Fit3
  path: galaxy-fit3
  icon: mdi:watch-variant
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Watch face
      icon: mdi:watch-variant
      badges:
      - type: entity
        entity: sensor.galaxy_fit3_battery
        show_state: true
    - type: markdown
      grid_options:
        columns: 12
        rows: auto
      content: '{% set p = state_attr(''select.galaxy_fit3_watch_face'', ''entity_picture'') %}{% if p %}<img src="{{ p }}" width="96" align="left" style="margin-right:16px">{% endif %}

        <small>Showing now</small>

        ### {{ states(''select.galaxy_fit3_watch_face'') if states(''select.galaxy_fit3_watch_face'') not in [''unknown'', ''unavailable''] else ''Waiting for the watch'' }}

        <small>Tap a face below to switch. The watch changes on its next connection, a few seconds when it is near Home Assistant.</small>'
    - type: heading
      heading: Tap to switch
      heading_style: subtitle
    - type: custom:streamline-card
      template: fit3_face
      variables:
        name: 3D time
        image: /local/galaxy_fit3/faces/face_77.png
      grid_options:
        columns: 3
        rows: auto
      visibility:
      - condition: template
        value_template: '{{ ''3D time'' in (state_attr(''select.galaxy_fit3_watch_face'', ''options'') or []) and not is_state(''select.galaxy_fit3_watch_face'', ''3D time'') }}'
