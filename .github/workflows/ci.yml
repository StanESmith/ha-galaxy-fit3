name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.10 runs on Python 3.14.
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Create venv and install test deps
        # dbus-fast lets the BlueZ pairing-agent tests run; without it they skip themselves.
        run: |
          uv venv
          uv pip install -r requirements-test.txt dbus-fast

      - name: Run tests
        run: |
          if command -v dbus-run-session >/dev/null 2>&1; then
            dbus-run-session -- .venv/bin/pytest -v
          else
            .venv/bin/pytest -v
          fi

  hassfest:
    name: HACS Validation (hassfest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/integration/action@main
        with:
          category: integration
